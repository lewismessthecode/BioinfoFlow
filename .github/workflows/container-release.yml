name: Publish Images

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Immutable numeric release tag to build."
        required: true
        type: string
      release_version:
        description: "Exact numeric release tag."
        required: true
        type: string
      release_major_minor:
        description: "Numeric major.minor release alias."
        required: true
        type: string
      release_major:
        description: "Numeric major release alias."
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: resolve image names
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
      frontend_localhost_image: ${{ steps.images.outputs.frontend_localhost }}
    steps:
      - name: Set image names
        id: images
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "backend=ghcr.io/${owner}/bioinfoflow-backend"
            echo "frontend=ghcr.io/${owner}/bioinfoflow-frontend"
            echo "frontend_localhost=ghcr.io/${owner}/bioinfoflow-frontend-localhost"
          } >> "$GITHUB_OUTPUT"

  publish-backend:
    name: publish backend
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate backend image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve.outputs.backend_image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.release_version }}
            type=raw,value=${{ inputs.release_major_minor }}
            type=raw,value=${{ inputs.release_major }}
            type=raw,value=latest

      - name: Publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  publish-frontend:
    name: publish frontend
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate authenticated frontend image tags
        id: frontend-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve.outputs.frontend_image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.release_version }}
            type=raw,value=${{ inputs.release_major_minor }}
            type=raw,value=${{ inputs.release_major }}
            type=raw,value=latest

      - name: Generate localhost frontend image tags
        id: localhost-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve.outputs.frontend_localhost_image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.release_version }}
            type=raw,value=${{ inputs.release_major_minor }}
            type=raw,value=${{ inputs.release_major }}
            type=raw,value=latest

      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
            NEXT_PUBLIC_AUTH_MODE=personal
            NEXT_PUBLIC_AUTH_LOCAL_ENABLED=true
            NEXT_PUBLIC_AUTH_SELF_SIGNUP_ENABLED=false
          tags: ${{ steps.frontend-metadata.outputs.tags }}
          labels: ${{ steps.frontend-metadata.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publish localhost frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
            NEXT_PUBLIC_AUTH_MODE=dev
            NEXT_PUBLIC_AUTH_LOCAL_ENABLED=true
            NEXT_PUBLIC_AUTH_SELF_SIGNUP_ENABLED=false
          tags: ${{ steps.localhost-metadata.outputs.tags }}
          labels: ${{ steps.localhost-metadata.outputs.labels }}
          cache-from: type=gha,scope=frontend-localhost
          cache-to: type=gha,mode=max,scope=frontend-localhost
