name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      docker_changed: ${{ steps.detect.outputs.docker_changed }}
      installer_changed: ${{ steps.detect.outputs.installer_changed }}
      workflows_changed: ${{ steps.detect.outputs.workflows_changed }}
      agent_browser_changed: ${{ steps.detect.outputs.agent_browser_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          run_full="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ]; then
            run_full="true"
          fi

          changed_files="$(mktemp)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$PR_BASE_SHA" "$GITHUB_SHA" > "$changed_files"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only "$MERGE_BASE_SHA" "$GITHUB_SHA" > "$changed_files"
          elif [ -n "${BEFORE_SHA:-}" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files"
          else
            git ls-files > "$changed_files"
            run_full="true"
          fi

          backend_changed="$run_full"
          frontend_changed="$run_full"
          docker_changed="$run_full"
          installer_changed="$run_full"
          workflows_changed="$run_full"
          agent_browser_changed="$run_full"

          if [ "$run_full" != "true" ]; then
            backend_changed="false"
            frontend_changed="false"
            docker_changed="false"
            installer_changed="false"
            workflows_changed="false"
            agent_browser_changed="false"

            if grep -Eq '^(backend/|\.env\.example$)' "$changed_files"; then
              backend_changed="true"
            fi

            if grep -Eq '^(frontend/|\.env\.example$)' "$changed_files"; then
              frontend_changed="true"
            fi

            if grep -Eq '^(backend/Dockerfile|frontend/Dockerfile|docker-compose(\.prod)?\.yml|backend/(pyproject\.toml|uv\.lock)|frontend/(package\.json|bun\.lock)|version\.txt|release-please-config\.json|\.release-please-manifest\.json|\.github/workflows/(ci|container-release|release-please|release)\.yml)$' "$changed_files"; then
              docker_changed="true"
            fi

            if grep -Eq '^(scripts/install\.sh|scripts/tests/|bundled-skills/|docker-compose\.local\.yml$)' "$changed_files"; then
              installer_changed="true"
            fi

            if grep -Eq '^\.github/workflows/' "$changed_files"; then
              workflows_changed="true"
              agent_browser_changed="true"
            fi

            if grep -Eq '^\.github/workflows/ci\.yml$' "$changed_files"; then
              backend_changed="true"
              frontend_changed="true"
              docker_changed="true"
              installer_changed="true"
              workflows_changed="true"
            fi

            if grep -Eq '^(backend/|frontend/)' "$changed_files"; then
              agent_browser_changed="true"
            fi

          fi

          {
            echo "backend_changed=$backend_changed"
            echo "frontend_changed=$frontend_changed"
            echo "docker_changed=$docker_changed"
            echo "installer_changed=$installer_changed"
            echo "workflows_changed=$workflows_changed"
            echo "agent_browser_changed=$agent_browser_changed"
          } >> "$GITHUB_OUTPUT"

          echo "backend_changed=$backend_changed"
          echo "frontend_changed=$frontend_changed"
          echo "docker_changed=$docker_changed"
          echo "installer_changed=$installer_changed"
          echo "workflows_changed=$workflows_changed"
          echo "agent_browser_changed=$agent_browser_changed"

  backend-checks:
    name: backend checks
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: backend/sandbox_worker/package-lock.json

      - name: Install and test sandbox worker
        working-directory: backend/sandbox_worker
        run: npm ci && npm test

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build backend sandbox image
        run: docker build -t bioinfoflow-backend:sandbox-ci .

      - name: Smoke test disposable Agent sandbox
        run: |
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/bioinfoflow-sandbox-smoke.XXXXXX")"
          trap 'sudo rm -rf "$smoke_root"' EXIT
          mkdir -p "$smoke_root/projects/demo" "$smoke_root/state"
          sudo chown -R 0:0 "$smoke_root/projects"
          docker run --rm \
            --name bioinfoflow-sandbox-ci-outer \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$smoke_root:$smoke_root" \
            -e "BIOINFOFLOW_HOME=$smoke_root" \
            --entrypoint python \
            bioinfoflow-backend:sandbox-ci \
            /app/scripts/sandbox_container_smoke.py \
            --image bioinfoflow-backend:sandbox-ci \
            --workspace "$smoke_root/projects/demo"

  frontend-lint:
    name: frontend lint
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check i18n coverage
        run: bun run lint:i18n

  frontend-test:
    name: frontend test
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  frontend-build:
    name: frontend build
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          AUTH_LOCAL_ENABLED: "true"
          AUTH_MODE: dev
          AUTH_SELF_SIGNUP_ENABLED: "false"
          BETTER_AUTH_SECRET: ci-better-auth-secret-for-github-actions
          BETTER_AUTH_URL: http://localhost:3000
          BIOINFOFLOW_HOME: /tmp/bioinfoflow
          BIOINFOFLOW_HOME_HOST: /tmp/bioinfoflow
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_AUTH_LOCAL_ENABLED: "true"
          NEXT_PUBLIC_AUTH_MODE: dev
          NEXT_PUBLIC_AUTH_SELF_SIGNUP_ENABLED: "false"

  agent-shell:
    name: agent shell (${{ matrix.viewport.name }})
    needs: changes
    if: needs.changes.outputs.agent_browser_changed == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - name: desktop
            width: 1440
            height: 900
          - name: tablet
            width: 1024
            height: 900
          - name: mobile
            width: 390
            height: 844
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      PLAYWRIGHT_FRONTEND_PORT: "3100"
      PLAYWRIGHT_BACKEND_PORT: "8100"
      PLAYWRIGHT_MODEL_PORT: "9100"
      PLAYWRIGHT_VIEWPORT_WIDTH: ${{ matrix.viewport.width }}
      PLAYWRIGHT_VIEWPORT_HEIGHT: ${{ matrix.viewport.height }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: backend/sandbox_worker/package-lock.json

      - name: Install sandbox worker
        working-directory: backend/sandbox_worker
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.13

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify Playwright toolchain and working directory
        run: |
          test "$PWD" = "$GITHUB_WORKSPACE/frontend"
          test "$PLAYWRIGHT_FRONTEND_PORT" = "3100"
          test "$PLAYWRIGHT_BACKEND_PORT" = "8100"
          test "$PLAYWRIGHT_MODEL_PORT" = "9100"
          bun --version
          node --version
          uv --version

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Run Agent shell E2E
        run: bun run test:e2e:agent-shell

      - name: Upload Agent shell Playwright report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-shell-${{ matrix.viewport.name }}-diagnostics
          path: frontend/.playwright-e2e/artifacts
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: docker build
    needs: changes
    if: needs.changes.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
            NEXT_PUBLIC_AUTH_MODE=dev
            NEXT_PUBLIC_AUTH_LOCAL_ENABLED=true
            NEXT_PUBLIC_AUTH_SELF_SIGNUP_ENABLED=false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  installer-checks:
    name: installer checks
    needs: changes
    if: needs.changes.outputs.installer_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify installer shell behavior
        run: |
          sh -n scripts/install.sh scripts/tests/install-test.sh
          shellcheck -e SC2317 scripts/install.sh scripts/tests/install-test.sh
          sh scripts/tests/install-test.sh

      - name: Verify localhost Compose renders
        run: docker compose --env-file scripts/tests/fixtures/local.env -f docker-compose.local.yml config >/dev/null

  workflow-checks:
    name: workflow checks
    needs: changes
    if: needs.changes.outputs.workflows_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  required:
    name: CI
    needs:
      - changes
      - backend-checks
      - frontend-lint
      - frontend-test
      - frontend-build
      - agent-shell
      - docker-build
      - installer-checks
      - workflow-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend_changed }}
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend_changed }}
          FRONTEND_LINT_RESULT: ${{ needs.frontend-lint.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend-test.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
          AGENT_BROWSER_CHANGED: ${{ needs.changes.outputs.agent_browser_changed }}
          AGENT_SHELL_RESULT: ${{ needs.agent-shell.result }}
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker_changed }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          INSTALLER_CHANGED: ${{ needs.changes.outputs.installer_changed }}
          INSTALLER_RESULT: ${{ needs.installer-checks.result }}
          WORKFLOWS_CHANGED: ${{ needs.changes.outputs.workflows_changed }}
          WORKFLOWS_RESULT: ${{ needs.workflow-checks.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not pass: $CHANGES_RESULT"
            exit 1
          fi

          require_result() {
            changed="$1"
            result="$2"
            label="$3"

            case "${changed}:${result}" in
              true:success)
                echo "$label passed."
                ;;
              false:skipped)
                echo "$label was not selected."
                ;;
              *)
                echo "$label has an invalid terminal state: changed=$changed result=$result"
                exit 1
                ;;
            esac
          }

          require_result "$BACKEND_CHANGED" "$BACKEND_RESULT" "Backend checks"
          require_result "$FRONTEND_CHANGED" "$FRONTEND_LINT_RESULT" "Frontend lint"
          require_result "$FRONTEND_CHANGED" "$FRONTEND_TEST_RESULT" "Frontend tests"
          require_result "$FRONTEND_CHANGED" "$FRONTEND_BUILD_RESULT" "Frontend build"
          require_result "$AGENT_BROWSER_CHANGED" "$AGENT_SHELL_RESULT" "Agent shell browser checks"
          require_result "$DOCKER_CHANGED" "$DOCKER_RESULT" "Docker build"
          require_result "$INSTALLER_CHANGED" "$INSTALLER_RESULT" "Installer checks"
          require_result "$WORKFLOWS_CHANGED" "$WORKFLOWS_RESULT" "Workflow checks"
